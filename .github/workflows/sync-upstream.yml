# 每 6 小时自动同步上游 morluto/rea 的更新到本仓库。
name: Sync Upstream

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      UPSTREAM_BRANCH: ${{ github.event.repository.default_branch || github.ref_name }}
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream and fetch
        run: |
          git remote add upstream https://github.com/morluto/rea.git
          git fetch upstream "$UPSTREAM_BRANCH" --tags

      - name: Check for new upstream commits
        id: check
        run: |
          count=$(git rev-list --count HEAD..upstream/"$UPSTREAM_BRANCH")
          echo "Behind by $count commit(s)."
          if [ "$count" -eq 0 ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fast-forward to upstream
        if: steps.check.outputs.changed == 'true'
        run: git merge upstream/"$UPSTREAM_BRANCH" --no-edit --allow-unrelated-histories -X ours --quiet || git merge --abort || true

      - name: Push
        if: steps.check.outputs.changed == 'true'
        run: git push origin main

      - name: Sync tags
        if: steps.check.outputs.changed == 'true'
        run: git push origin --tags --force
